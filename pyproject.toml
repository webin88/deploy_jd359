[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "webin88-deploy_jd359"
version = "0.1.0"
description = "统计各来源片段的贡献量与占比，标出模型部署工程师·结构化输出的约束解码上最主要的来源"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "webin88" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://webin88.github.io"
Repository = "https://github.com/webin88/deploy_jd359"
Issues = "https://github.com/webin88/deploy_jd359/issues"

[project.scripts]
deploy_jd359 = "deploy_jd359:main"

[tool.setuptools]
py-modules = ["deploy_jd359"]
